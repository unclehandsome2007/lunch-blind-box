<!DOCTYPE html>
<html class="light bg-background" lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Room {{ room_id }} | 蛤又要吃午餐</title>
    <link href="{{ url_for('static', filename='manifest.json') }}" rel="manifest"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#fff8f7", surface: "#fff8f7", primary: "#ba1a1a",
                        "primary-container": "#ffdad6", "on-primary-container": "#410002",
                        "surface-variant": "#f5dddb", "on-surface-variant": "#584140",
                        secondary: "#775653", "secondary-container": "#ffdad6",
                        "outline-variant": "#e0bfbd", "tertiary-container": "#00b179"
                    },
                    fontFamily: {
                        "body-md": ["Noto Sans"], "label-md": ["Noto Sans"],
                        "headline-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-neutral-900 font-body-md min-h-screen flex flex-col antialiased relative selection:bg-primary/20">

    <header class="fixed top-0 w-full z-40 bg-surface/80 backdrop-blur-xl border-b border-surface-variant/50 transition-all duration-300 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button onclick="window.location.href='/app'" class="p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div class="flex flex-col">
                    <h1 class="font-bold text-lg leading-tight">Room #{{ room_id }}</h1>
                    <div class="flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span class="text-[10px] text-green-600 font-semibold" id="room-settings-display">連線中...</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="p-2 rounded-full hover:bg-surface-variant transition-colors flex" onclick="shareRoom()">
                    <span class="material-symbols-outlined">share</span>
                </button>
                <button class="p-2 rounded-full hover:bg-surface-variant transition-colors flex" onclick="toggleBottomSheet()">
                    <span class="material-symbols-outlined">settings</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 pt-24 pb-32 px-4 max-w-4xl mx-auto w-full flex flex-col gap-6">
        
        <section id="join-section" class="glass-panel rounded-2xl p-6 shadow-sm border border-outline-variant/30 animate-fade-in">
            <h2 class="font-bold text-xl mb-4 text-on-surface">你的暱稱</h2>
            <div class="flex gap-3">
                <input type="text" id="username" class="flex-grow px-4 py-3 bg-white border border-outline-variant focus:border-primary rounded-xl outline-none" placeholder="如: 大明" required>
                <button onclick="joinRoom()" class="px-6 py-3 bg-primary text-white font-bold rounded-xl hover:bg-red-800 transition-colors shadow-sm">加入</button>
            </div>
        </section>

        <section id="user-list-div" style="display: none;" class="flex flex-col gap-3 animate-fade-in">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-sm text-on-surface-variant uppercase tracking-wider">小隊成員 (<span id="user-count-display">0</span>)</h2>
            </div>
            <div id="user-ul" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 pt-1">
                </div>
            <button id="draw-btn" onclick="startMultiGacha()" class="mt-4 w-full py-4 bg-primary text-white font-bold rounded-2xl hover:bg-red-800 transition-colors shadow-lg shadow-primary/20 text-lg flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">casino</span>全員到齊，開抽！
            </button>
        </section>

        <section id="result-panel" style="display: none;" class="mt-2 relative animate-fade-in">
            <div class="glass-panel rounded-2xl overflow-hidden flex flex-col shadow-sm border border-outline-variant/30">
                <div class="p-5 flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <div class="flex flex-wrap gap-2 mb-1" id="result-badges">
                            <span class="bg-primary-container text-on-primary-container text-xs font-bold px-2 py-1 rounded-md">盲盒開獎</span>
                            <span id="result-weather" style="display:none;" class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-md flex items-center gap-1"><span class="material-symbols-outlined" style="font-size: 14px;">rainy</span> 下雨縮減</span>
                        </div>
                        <h3 id="result-name" class="text-2xl font-bold text-gray-900 leading-tight tracking-tight mt-1">載入中...</h3>
                        <p id="result-address" class="text-sm text-gray-500"></p>
                    </div>
                    
                    <div class="flex flex-col gap-2 relative">
                        <h4 class="font-bold text-sm text-gray-700">位置</h4>
                        <div id="map" class="h-48 w-full rounded-xl overflow-hidden border border-outline-variant/30 z-10 relative"></div>
                    </div>

                    <div class="mt-2">
                        <button onclick="toggleMultiAlternatives()" id="toggle-multi-alt-btn" class="w-full py-3 border-2 border-outline-variant text-secondary font-bold rounded-xl hover:bg-surface-variant transition-colors text-sm">沒人想吃這家？換備選</button>
                        <div id="alternatives-panel" class="mt-3 space-y-2 hidden"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="eta-section" style="display: none;" class="mt-2 flex flex-col gap-3">
            <h3 class="font-bold text-sm text-on-surface-variant uppercase tracking-wider">即時抵達狀態</h3>
            <div class="glass-panel rounded-2xl p-4 flex flex-col gap-3 border border-outline-variant/30" id="eta-ul">
                </div>
        </section>
    </main>

    <div id="sticky-actions" style="display: none;" class="fixed bottom-0 left-0 w-full z-40 px-4 py-4 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0_-4px_30px_rgba(0,0,0,0.05)]">
        <div class="max-w-4xl mx-auto flex gap-3">
            <button onclick="startMultiGacha()" class="flex-1 bg-surface-variant text-on-surface font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined">refresh</span>重抽
            </button>
            <button onclick="openBillSection()" class="flex-[2] bg-primary text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:scale-[0.98] transition-transform">
                <span class="material-symbols-outlined fill">receipt_long</span>飯後分帳
            </button>
        </div>
    </div>

    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300" id="bottomSheetOverlay" onclick="toggleBottomSheet()"></div>
    <div class="fixed bottom-0 left-0 w-full z-50 bg-surface rounded-t-3xl shadow-2xl transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85vh]" id="bottomSheet">
        <div class="w-full flex justify-center py-3 cursor-pointer" onclick="toggleBottomSheet()">
            <div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
        </div>
        <div class="px-6 pb-10 pt-2 overflow-y-auto">
            <h2 class="text-2xl font-bold text-on-surface mb-6">房間工具</h2>
            
            <div id="bill-module" class="bg-surface-container rounded-xl p-5 border border-outline-variant/20 mb-6 hidden">
                <div class="flex items-center gap-3 mb-4 text-primary">
                    <span class="material-symbols-outlined fill text-3xl">payments</span>
                    <h3 class="font-bold text-lg">快速分帳 <span class="text-sm font-normal text-gray-500">(<span id="bill-user-count">0</span> 人)</span></h3>
                </div>
                <input type="number" id="total-bill" placeholder="輸入總金額" oninput="calculateSplit()" class="w-full text-center text-3xl font-bold text-secondary bg-white border border-outline-variant rounded-xl py-4 mb-4 focus:outline-none focus:border-primary">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-outline-variant/50 mb-4">
                    <span class="text-gray-500 font-semibold">每人應付</span>
                    <span id="split-result" class="text-3xl font-black text-primary">-- 元</span>
                </div>
                <button onclick="copyBillText()" class="w-full border-2 border-primary text-primary font-bold py-3 rounded-xl hover:bg-primary hover:text-white transition-colors">複製收款文字</button>
            </div>

            <div class="flex flex-col gap-5">
                <h3 class="font-bold text-lg border-b border-outline-variant/30 pb-2">房間設定 (同步所有人)</h3>
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <label class="block text-sm font-semibold">步行極限</label>
                        <div class="text-primary font-bold"><span id="set-time-val">15</span> 分鐘</div>
                    </div>
                    <input type="range" id="set-max-time" min="1" max="60" value="15" oninput="document.getElementById('set-time-val').innerText = this.value" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" style="accent-color: #ba1a1a;">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">想吃的種類</label>
                    <input type="text" id="set-keyword" class="w-full px-4 py-3 bg-white border border-outline-variant focus:border-primary rounded-xl outline-none" placeholder="如: 義大利麵">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">天氣模擬</label>
                    <select id="set-weather" class="w-full px-4 py-3 bg-white border border-outline-variant focus:border-primary rounded-xl outline-none">
                        <option value="auto">即時天氣</option>
                        <option value="clear">晴天</option>
                        <option value="rain">下雨</option>
                    </select>
                </div>
                <button onclick="saveRoomSettings()" class="w-full py-4 bg-gray-800 text-white font-bold rounded-xl shadow-sm mt-2">儲存設定</button>
            </div>
        </div>
    </div>

    <div id="gacha-overlay" class="fixed inset-0 z-[60] bg-surface/95 backdrop-blur-md hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <h2 class="text-3xl font-bold text-primary mb-8 tracking-wider">命運抽取中...</h2>
        <div class="w-32 h-32 bg-gradient-to-br from-primary-container to-primary rounded-3xl shadow-2xl flex items-center justify-center relative transform rotate-12 animate-bounce">
            <span class="material-symbols-outlined text-white" style="font-size: 64px;">lunch_dining</span>
            <div class="absolute inset-0 rounded-3xl border-4 border-white/30 animate-ping"></div>
        </div>
        <p id="gacha-overlay-text" class="text-on-surface-variant font-bold mt-12 animate-pulse">某人發動了盲盒抽取...</p>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDWKkH23qelWLpPIKylzmLaGwGwDS2olpM", authDomain: "lunch-blind-box.firebaseapp.com", databaseURL: "https://lunch-blind-box-default-rtdb.firebaseio.com", projectId: "lunch-blind-box", storageBucket: "lunch-blind-box.firebasestorage.app", messagingSenderId: "42934291834", appId: "1:42934291834:web:71bb1b07d96f9c95451ac3" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const roomId = "{{ room_id }}";
        
        window.roomSettings = { maxTime: parseInt("{{ max_time }}") || 15, keyword: "{{ keyword }}" || "", weatherOverride: "{{ weather_override }}" || "auto" };
        let userId = localStorage.getItem('multi_user_id') || ("USER_" + Math.floor(Math.random() * 1000000));
        localStorage.setItem('multi_user_id', userId);

        let map = null, userMarkers = {}, restaurantMarker = null, myRouteLayer = null;
        let currentUsersData = [], currentResult = null, lastUpdateTime = 0;
        window.userCount = 0; window.allDrawnRestaurants = []; window.lastViewedRest = null;

        // --- Bottom Sheet & UI 控制 ---
        const bottomSheet = document.getElementById('bottomSheet');
        const bottomSheetOverlay = document.getElementById('bottomSheetOverlay');
        let isSheetOpen = false;

        window.toggleBottomSheet = () => {
            isSheetOpen = !isSheetOpen;
            if (isSheetOpen) {
                bottomSheetOverlay.classList.remove('hidden');
                setTimeout(() => { bottomSheetOverlay.classList.remove('opacity-0'); bottomSheet.classList.remove('translate-y-full'); }, 10);
            } else {
                bottomSheetOverlay.classList.add('opacity-0'); bottomSheet.classList.add('translate-y-full');
                setTimeout(() => { bottomSheetOverlay.classList.add('hidden'); }, 300);
            }
        };

        window.openBillSection = () => {
            document.getElementById('bill-module').classList.remove('hidden');
            window.toggleBottomSheet();
        };

        window.shareRoom = () => {
            const url = window.location.href;
            if (navigator.share) navigator.share({ title: '午餐房間', url: url }).catch(console.error);
            else { navigator.clipboard.writeText(url); alert("房間網址已複製！"); }
        }

        window.toggleMultiAlternatives = () => {
            const panel = document.getElementById('alternatives-panel');
            const btn = document.getElementById('toggle-multi-alt-btn');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden'); btn.innerText = '收起備選名單';
            } else {
                panel.classList.add('hidden'); btn.innerText = '沒人想吃這家？換備選';
            }
        }

        // --- Firebase 與主邏輯 ---
        window.switchRestaurant = (idx) => {
            const chosen = window.allDrawnRestaurants[idx];
            update(ref(db, `rooms/${roomId}/result`), { selectedIndex: idx, chosen_restaurant: chosen });
            window.toggleMultiAlternatives(); 
        };

        onValue(ref(db, `rooms/${roomId}/settings`), (snapshot) => {
            if (snapshot.exists()) window.roomSettings = snapshot.val();
            else set(ref(db, `rooms/${roomId}/settings`), window.roomSettings);
            
            let weatherStr = window.roomSettings.weatherOverride === 'auto' ? '即時天氣' : (window.roomSettings.weatherOverride === 'clear' ? '晴天' : '雨天');
            let keywordStr = window.roomSettings.keyword ? `${window.roomSettings.keyword}` : '不限';
            document.getElementById('room-settings-display').innerText = `${window.roomSettings.maxTime}分 | ${keywordStr} | ${weatherStr}`;

            document.getElementById('set-max-time').value = window.roomSettings.maxTime;
            document.getElementById('set-time-val').innerText = window.roomSettings.maxTime;
            document.getElementById('set-keyword').value = window.roomSettings.keyword;
            document.getElementById('set-weather').value = window.roomSettings.weatherOverride;
        });

        window.saveRoomSettings = () => {
            const newSettings = {
                maxTime: parseInt(document.getElementById('set-max-time').value),
                keyword: document.getElementById('set-keyword').value.trim(),
                weatherOverride: document.getElementById('set-weather').value
            };
            update(ref(db, `rooms/${roomId}/settings`), newSettings);
            window.toggleBottomSheet();
        };

        window.startMultiGacha = () => {
            update(ref(db, `rooms/${roomId}`), { isDrawing: true });
            if (window.lastViewedRest) { removeHistoryByName(window.lastViewedRest); window.lastViewedRest = null; }
            let history = JSON.parse(localStorage.getItem('lunch_history_v2') || '[]');
            
            fetch('/api/multi_draw', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ users: currentUsersData, max_time: window.roomSettings.maxTime, keyword: window.roomSettings.keyword, weather_override: window.roomSettings.weatherOverride, history: history.map(h=>h.name) })
            }).then(res => res.json()).then(data => {
                if (data.error) { alert("錯誤：" + data.error); update(ref(db, `rooms/${roomId}`), { isDrawing: false }); } 
                else { update(ref(db, `rooms/${roomId}`), { result: data, isDrawing: false }); }
            }).catch(err => { alert("連線錯誤！"); update(ref(db, `rooms/${roomId}`), { isDrawing: false }); });
        };

        const gachaEl = document.getElementById('gacha-overlay');
        onValue(ref(db, `rooms/${roomId}/isDrawing`), (snapshot) => {
            if (snapshot.val() === true) {
                document.getElementById('gacha-overlay-text').innerText = window.allDrawnRestaurants.length > 0 ? "有人重新抽取！正在抽餐廳中..." : "有人點選抽取！正在抽餐廳...";
                gachaEl.classList.remove('hidden'); gachaEl.classList.add('flex');
                setTimeout(() => gachaEl.classList.remove('opacity-0'), 10);
            } else {
                gachaEl.classList.add('opacity-0');
                setTimeout(() => { gachaEl.classList.add('hidden'); gachaEl.classList.remove('flex'); }, 300);
            }
        });

        function drawRestaurantMarker() {
            if (!map || !currentResult) return;
            // 修正 Leaflet 在隱藏 div 載入時破圖的問題
            map.invalidateSize();
            
            const redIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
            if (restaurantMarker) map.removeLayer(restaurantMarker);
            
            const navPopup = `<div style="text-align:center; min-width:150px;"><h3 class="font-bold text-sm mb-2">${currentResult.name}</h3><a href="https://www.google.com/maps/dir/?api=1&destination=$${currentResult.lat},${currentResult.lon}" target="_blank" class="block w-full bg-blue-50 text-blue-600 font-bold py-2 rounded-lg mb-1 no-underline">Google 導航</a></div>`;
            restaurantMarker = L.marker([currentResult.lat, currentResult.lon], {icon: redIcon}).bindPopup(navPopup).addTo(map).openPopup();
            
            const myData = currentUsersData.find(u => u.id === userId);
            if (myData) map.fitBounds(L.latLngBounds([myData.lat, myData.lon], [currentResult.lat, currentResult.lon]), { padding: [40, 40] });
        }

        window.joinRoom = () => {
            const name = document.getElementById('username').value;
            if (!name) return alert("請輸入暱稱！");
            document.getElementById('join-section').style.display = 'none';
            document.getElementById('user-list-div').style.display = 'block';

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude; const lon = position.coords.longitude;
                    if (!map) {
                        map = L.map('map').setView([lat, lon], 16);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);
                        if (currentResult) drawRestaurantMarker();
                    }
                    const now = Date.now();
                    if (now - lastUpdateTime > 4000) {
                        lastUpdateTime = now;
                        const userRef = ref(db, `rooms/${roomId}/users/${userId}`);
                        onDisconnect(userRef).remove().catch(console.error);
                        set(userRef, { name: name, lat: lat, lon: lon, timestamp: now });
                    }
                }, (error) => alert("請允許 GPS 權限！"), { enableHighAccuracy: true });
            }
        };

        function updateLiveETAs() {
            if (!currentResult || currentUsersData.length === 0 || !map) return;
            const ul = document.getElementById('eta-ul');

            currentUsersData.forEach(u => {
                const safeNameId = "eta-user-" + encodeURIComponent(u.name).replace(/%/g, '');
                let li = document.getElementById(safeNameId);
                if (!li) { 
                    li = document.createElement('div'); li.id = safeNameId; 
                    li.className = "flex items-center gap-3 bg-white p-3 rounded-xl shadow-sm border border-outline-variant/20";
                    ul.appendChild(li); 
                }

                const straightDist = map.distance([u.lat, u.lon], [currentResult.lat, currentResult.lon]);
                const isMe = (u.id === userId);
                
                fetch(`https://router.project-osrm.org/route/v1/foot/${u.lon},${u.lat};${currentResult.lon},${currentResult.lat}?overview=${isMe ? "full&geometries=geojson" : "false"}`)
                .then(res => res.json()).then(data => {
                    if(data.code === 'Ok' && data.routes.length > 0) {
                        let dist = Math.round(data.routes[0].distance);
                        if (dist > straightDist * 3) {
                            dist = Math.round(straightDist * 1.2); 
                            if (isMe) {
                                if (myRouteLayer) map.removeLayer(myRouteLayer);
                                myRouteLayer = L.polyline([[u.lat, u.lon], [currentResult.lat, currentResult.lon]], { color: '#e74c3c', weight: 6, dashArray: '10, 10' }).addTo(map);
                            }
                        } else {
                            if (isMe && data.routes[0].geometry) {
                                if (myRouteLayer) map.removeLayer(myRouteLayer); 
                                myRouteLayer = L.geoJSON(data.routes[0].geometry, { style: { color: '#0984e3', weight: 6, dashArray: '10,10' } }).addTo(map);
                            }
                        }
                        let mins = Math.max(1, Math.round(dist / 80));
                        let initial = u.name.charAt(0).toUpperCase();
                        let isArrived = straightDist <= 40;
                        
                        let statusHtml = isArrived ? 
                            `<span class="text-xs font-bold text-green-600 bg-green-100 px-2 py-1 rounded-md">🏁 已抵達</span>` : 
                            `<span class="text-sm font-bold text-primary">${mins} 分鐘</span><span class="text-xs text-gray-500 ml-2">${dist}m</span>`;

                        li.innerHTML = `
                            <div class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center text-white font-bold shadow-inner">${initial}</div>
                            <div class="flex-1 flex flex-col">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="font-bold text-gray-800">${u.name}</span>
                                    <div>${statusHtml}</div>
                                </div>
                                <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full ${isArrived ? 'bg-green-500 w-full' : 'bg-primary w-[80%] relative'}">
                                        ${!isArrived ? '<div class="absolute right-0 top-0 bottom-0 w-4 bg-white/30 animate-pulse"></div>' : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });
            });
        }

        onValue(ref(db, `rooms/${roomId}/users`), (snapshot) => {
            const users = snapshot.val();
            currentUsersData = [];
            const ul = document.getElementById('user-ul'); ul.innerHTML = '';
            for (let id in userMarkers) map.removeLayer(userMarkers[id]); userMarkers = {};
            if (!users) { window.userCount = 0; document.getElementById('user-count-display').innerText = 0; return; }

            for (let id in users) {
                const u = users[id]; u.id = id; currentUsersData.push(u);
                let initial = u.name.charAt(0).toUpperCase();
                ul.innerHTML += `
                    <div class="relative flex-shrink-0 flex flex-col items-center gap-1 group">
                        <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-primary to-primary-container text-white flex items-center justify-center font-bold text-xl shadow-md border-2 border-surface">${initial}</div>
                        <span class="text-xs font-semibold text-on-surface-variant">${u.name}</span>
                        <div class="absolute top-0 right-0 w-4 h-4 bg-green-500 rounded-full border-2 border-surface"></div>
                    </div>`;
                if (map) userMarkers[id] = L.marker([u.lat, u.lon]).bindPopup(`🙋‍♂️ ${u.name}`).addTo(map);
            }
            window.userCount = currentUsersData.length; 
            document.getElementById('user-count-display').innerText = window.userCount;
            document.getElementById('bill-user-count').innerText = window.userCount;
            window.calculateSplit();
            if (currentResult) updateLiveETAs();
        });

        onValue(ref(db, `rooms/${roomId}/result`), (snapshot) => {
            const data = snapshot.val();
            if (data && data.chosen_restaurants) {
                window.allDrawnRestaurants = data.chosen_restaurants;
                const currentIdx = data.selectedIndex || 0;
                currentResult = window.allDrawnRestaurants[currentIdx];

                document.getElementById('result-panel').style.display = 'block';
                document.getElementById('eta-section').style.display = 'flex';
                document.getElementById('draw-btn').style.display = 'none';
                document.getElementById('sticky-actions').style.display = 'flex';

                document.getElementById('result-name').innerHTML = currentResult.name;
                document.getElementById('result-address').innerText = currentResult.full_address || "距離 " + currentResult.distance_meters + "m";
                
                let weatherEl = document.getElementById('result-weather');
                if(data.is_raining) { weatherEl.style.display="inline-flex"; } else { weatherEl.style.display="none"; }

                if (window.lastViewedRest && window.lastViewedRest !== currentResult.name) { if(typeof removeHistoryByName === 'function') removeHistoryByName(window.lastViewedRest); }
                if (window.lastViewedRest !== currentResult.name) { if(typeof saveToHistory === 'function') saveToHistory(currentResult.name); window.lastViewedRest = currentResult.name; }

                let altHtml = '';
                window.allDrawnRestaurants.forEach((alt, idx) => {
                    if (idx !== currentIdx) {
                        altHtml += `<div class="bg-white border border-outline-variant/50 p-3 rounded-xl flex justify-between items-center shadow-sm">
                            <h4 class="font-bold text-gray-800 text-sm">${alt.name}</h4>
                            <button onclick="switchRestaurant(${idx})" class="px-3 py-1.5 bg-surface-variant text-secondary font-bold text-xs rounded-lg hover:bg-outline-variant transition-colors">👉 切換</button>
                        </div>`;
                    }
                });
                document.getElementById('alternatives-panel').innerHTML = altHtml;

                document.getElementById('eta-ul').innerHTML = ''; 
                drawRestaurantMarker(); updateLiveETAs();
            }
        });

        window.calculateSplit = () => {
            const total = parseFloat(document.getElementById('total-bill').value);
            if (!total || isNaN(total) || window.userCount === 0) { document.getElementById('split-result').innerText = "-- 元"; return; }
            document.getElementById('split-result').innerText = `${Math.ceil(total / window.userCount)} 元`;
        }
        
        window.copyBillText = () => {
            const total = document.getElementById('total-bill').value;
            const split = document.getElementById('split-result').innerText;
            if(!total) return alert("請先輸入金額！");
            const text = `嗨嗨~剛才的午餐總共 ${total} 元\n我們總共 ${window.userCount} 人\n所以每人需付：${split}\n\n請記得給我喔！謝謝~🙏`;
            navigator.clipboard.writeText(text).then(() => alert("收款文案已複製！"));
        }
    </script>
</body>
</html>
